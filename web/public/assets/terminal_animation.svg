<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" style="width: 100%; max-width: 100%; height: auto;" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <filter id="neonTerm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fadeStep1 {
        0%, 5% { opacity: 0; transform: translateY(4px); }
        8%, 95% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes fadeStep2 {
        0%, 22% { opacity: 0; transform: translateY(4px); }
        26%, 95% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes fadeStep3 {
        0%, 45% { opacity: 0; transform: translateY(4px); }
        50%, 95% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes fadeStep4 {
        0%, 68% { opacity: 0; transform: translateY(4px); }
        73%, 95% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes winGlow {
        0%, 75% { opacity: 0; transform: scale(0.98); }
        80% { opacity: 1; transform: scale(1.01); }
        85%, 95% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; }
      }
      .cursor-blink {
        animation: blinkCursor 0.9s infinite;
      }
      .anim-step1 {
        animation: fadeStep1 16s ease-in-out infinite;
      }
      .anim-step2 {
        animation: fadeStep2 16s ease-in-out infinite;
      }
      .anim-step3 {
        animation: fadeStep3 16s ease-in-out infinite;
      }
      .anim-step4 {
        animation: fadeStep4 16s ease-in-out infinite;
      }
      .anim-win {
        animation: winGlow 16s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer Window Shadow & Box -->
  <rect x="2" y="2" width="896" height="416" rx="16" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.8" />

  <!-- Terminal Window Titlebar -->
  <rect x="2" y="2" width="896" height="38" rx="16" fill="url(#headerBg)" />
  <rect x="2" y="24" width="896" height="16" fill="url(#headerBg)" />
  <line x1="2" y1="40" x2="898" y2="40" stroke="#334155" stroke-width="1" />

  <!-- Window Traffic Light Buttons -->
  <circle cx="24" cy="20" r="6" fill="#ef4444" />
  <circle cx="44" cy="20" r="6" fill="#eab308" />
  <circle cx="64" cy="20" r="6" fill="#22c55e" />

  <!-- Window Title -->
  <text x="450" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    cadet@laptop: ~/cloudarena (local k3d sandbox)
  </text>

  <!-- Tag Pill in Titlebar -->
  <rect x="750" y="10" width="130" height="20" rx="6" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" />
  <text x="815" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">
    INTERACTIVE DEMO
  </text>

  <!-- Terminal Content Body -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="500">
    
    <!-- STEP 1: cloudarena start -->
    <g class="anim-step1">
      <text x="30" y="75" fill="#38bdf8" font-weight="700">cadet@laptop:~$ <tspan fill="#ffffff">cloudarena start</tspan></text>
      
      <!-- Output 1 -->
      <g font-size="12">
        <text x="45" y="98" fill="#a855f7" font-weight="700">🚀 CloudArena Cluster Launcher</text>
        <text x="45" y="118" fill="#94a3b8">• Checking prerequisites: Docker Engine <tspan fill="#10b981">✓</tspan>, k3d <tspan fill="#10b981">✓</tspan>, kubectl <tspan fill="#10b981">✓</tspan></text>
        <text x="45" y="138" fill="#94a3b8">• Creating 3-node mesh (<tspan fill="#38bdf8">1 server + 2 agents</tspan>)... <tspan fill="#10b981" font-weight="700">Online [3/3 Ready]</tspan></text>
        <text x="45" y="158" fill="#10b981" font-weight="700">✓ Microservices deployed in namespace "cloudarena-app" [100% Healthy]</text>
      </g>
    </g>

    <!-- STEP 2: cloudarena wave start 1 -->
    <g class="anim-step2">
      <text x="30" y="192" fill="#38bdf8" font-weight="700">cadet@laptop:~$ <tspan fill="#ffffff">cloudarena wave start 1</tspan></text>

      <!-- Output 2 -->
      <g font-size="12">
        <text x="45" y="215" fill="#f43f5e" font-weight="800">⚔️ INCIDENT ACTIVE: Wave 1: Rogue CPU Hog</text>
        <text x="45" y="235" fill="#fbbf24">• Observed Symptoms: Node compute throttled at <tspan fill="#f43f5e" font-weight="700">98.4%</tspan>; probe latency 1850ms</text>
        <text x="45" y="255" fill="#94a3b8">• Attestation Nonce: <tspan fill="#38bdf8">hmac_w1_7f8a9b</tspan> injected into cluster secret <tspan fill="#10b981">✓</tspan></text>
      </g>
    </g>

    <!-- STEP 3: cloudarena wave watch -->
    <g class="anim-step3">
      <text x="30" y="288" fill="#38bdf8" font-weight="700">cadet@laptop:~$ <tspan fill="#ffffff">cloudarena wave watch</tspan></text>

      <!-- Output 3 -->
      <g font-size="12">
        <text x="45" y="310" fill="#38bdf8">📊 Traffic Monitor: <tspan fill="#10b981" font-weight="700">[████████████████████████] 100.0% Success (120 req/s)</tspan></text>
        <text x="45" y="330" fill="#94a3b8">⏱️ Stabilization Window: <tspan fill="#10b981" font-weight="700">10.0s / 10.0s [MESH STABLE ✓]</tspan></text>
        <text x="45" y="350" fill="#e2e8f0">🔐 Cryptographic HMAC Attestation: <tspan fill="#00f0ff">ca_cert_7f8a9b2c3d4e5f60</tspan></text>
      </g>
    </g>

    <!-- STEP 4: WINNER BANNER -->
    <g class="anim-win">
      <rect x="35" y="365" width="830" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
      <circle cx="55" cy="384" r="5" fill="#10b981" class="cursor-blink" />
      <text x="70" y="388" fill="#6ee7b7" font-size="13" font-weight="800">
        🏆 WAVE 1 CLEARED! +500 PTS SYNCED TO LIVE LEADERBOARD • AI SRE Post-Mortem Generated
      </text>
    </g>

    <!-- Blinking Cursor at bottom -->
    <text x="30" y="385" fill="#00f0ff" class="cursor-blink" font-size="16">▌</text>

  </g>
</svg>
