apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: cloudarena-app
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        resolver 10.43.0.10 valid=5s ipv6=off;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /healthz {
            return 200 '{"status":"ok","component":"frontend"}';
            add_header Content-Type application/json;
        }

        location /api/ {
            set $backend "http://backend-service.cloudarena-app.svc.cluster.local:8080";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>CloudArena Target Application</title>
      <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; max-width: 600px; margin: auto; }
        h1 { color: #38bdf8; }
        .status { padding: 4px 8px; border-radius: 4px; background: #22c55e; color: #000; font-weight: bold; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🌩️ CloudArena App Battlefield</h1>
        <p>Operational Status: <span class="status">HEALTHY</span></p>
        <p>This is the sample microservice application under active monitoring.</p>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudarena-app
  labels:
    app.kubernetes.io/name: frontend
    cloudarena.io/role: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: html-content
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: nginx-conf
        configMap:
          name: frontend-config
      - name: html-content
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: cloudarena-app
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app.kubernetes.io/name: frontend
