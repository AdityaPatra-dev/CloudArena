apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-redis
  namespace: cloudarena-app
  labels:
    app.kubernetes.io/name: cache-redis
    cloudarena.io/role: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cache-service
  namespace: cloudarena-app
  labels:
    app.kubernetes.io/name: cache-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app.kubernetes.io/name: cache-redis
