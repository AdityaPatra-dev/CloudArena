[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudarena"
version = "0.1.0"
description = "AI-Powered Cloud Infrastructure Survival Arena (Educational Kubernetes Troubleshooting Game)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditya Patra" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "kubernetes>=29.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cloudarena = "cloudarena.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudarena*"]
